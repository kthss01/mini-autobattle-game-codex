<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101728"/>
      <stop offset="1" stop-color="#1B345D"/>
    </linearGradient>
    <linearGradient id="glow" x1="220" y1="180" x2="1060" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EE3FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9F8CFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#7AC7FF" fill-opacity="0.16"/>
  <circle cx="180" cy="620" r="260" fill="#8C6BFF" fill-opacity="0.18"/>
  <rect x="150" y="120" width="980" height="480" rx="36" fill="url(#glow)" stroke="#AFC8FF" stroke-opacity="0.3" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="182" y="168" width="916" height="304" rx="28" fill="#0C1325" fill-opacity="0.84"/>
  </g>

  <text x="640" y="250" fill="#EAF1FF" text-anchor="middle" font-size="68" font-family="'Segoe UI', 'Pretendard', sans-serif" font-weight="700">
    MINI AUTOBATTLE
  </text>
  <text x="640" y="312" fill="#9DB6E6" text-anchor="middle" font-size="34" font-family="'Segoe UI', 'Pretendard', sans-serif" font-weight="500">
    Phaser Client + Headless Simulator
  </text>

  <g>
    <rect x="230" y="505" width="820" height="112" rx="20" fill="#0A1121" fill-opacity="0.75" stroke="#38507B"/>

    <image href="./sprites/tank_guard.png" x="260" y="529" width="64" height="64"/>
    <image href="./sprites/bruiser_reaper.png" x="350" y="529" width="64" height="64"/>
    <image href="./sprites/mage_pyro.png" x="440" y="529" width="64" height="64"/>
    <image href="./sprites/sniper_ranger.png" x="530" y="529" width="64" height="64"/>
    <image href="./sprites/healer_priest.png" x="620" y="529" width="64" height="64"/>
    <image href="./sprites/support_frost.png" x="710" y="529" width="64" height="64"/>
    <image href="./sprites/diver_blade.png" x="800" y="529" width="64" height="64"/>
    <image href="./sprites/summoner_witch.png" x="890" y="529" width="64" height="64"/>
  </g>
</svg>
